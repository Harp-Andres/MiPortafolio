<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#1e293b"/>
  
  <!-- Code brackets <> -->
  <g transform="translate(20, 30)">
    <!-- Left bracket < -->
    <path d="M 15 5 L 5 15 L 15 25" stroke="#3b82f6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right bracket > -->
    <path d="M 35 5 L 45 15 L 35 25" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Center vertical line (code) -->
    <line x1="25" y1="8" x2="25" y2="22" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Test symbol (checkmark in circle) -->
  <circle cx="70" cy="70" r="12" fill="none" stroke="#10b981" stroke-width="2"/>
  <path d="M 65 70 L 68 73 L 75 67" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
